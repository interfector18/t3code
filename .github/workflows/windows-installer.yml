name: Windows installer

# Personal fork builds use native Windows. WSL needs a separately built Linux
# CLI archive; this workflow deliberately does not bundle one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned Windows ARM64 installer
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      # Avoid checkout's submodule cleanup on the orphaned .repos gitlinks.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -notin @(0, 3010)) {
            throw "Visual Studio Installer failed: $($proc.ExitCode)"
          }

      - name: Install build dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Configure nightly build
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          build_date="$(date -u +%Y%m%d)"
          version="${base_version}-nightly.${build_date}.${GITHUB_RUN_NUMBER}"
          node scripts/update-release-package-versions.ts "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # This file contains public T3 Connect identifiers, not credentials.
          cp .env.example .env

      - name: Build installer
        run: vp run dist:desktop:win:arm64 --verbose

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-arm64-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Only publish a complete installer and its matching update metadata.
          test -f release/nightly.yml
          shopt -s nullglob
          installers=(release/*-arm64.exe)
          blockmaps=(release/*-arm64.exe.blockmap)
          test "${#installers[@]}" -eq 1
          test "${#blockmaps[@]}" -eq 1
          gh release create "v${BUILD_VERSION}" \
            "${installers[@]}" "${blockmaps[@]}" release/nightly.yml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Windows ARM64 ${BUILD_VERSION}" \
            --notes "Unsigned Windows ARM64 build from commit ${GITHUB_SHA}. Native Windows backend; WSL runtime is not bundled." \
            --prerelease
