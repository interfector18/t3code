name: Desktop installers

# Personal fork builds use native Windows. WSL needs a separately built Linux
# CLI archive; this workflow deliberately does not bundle one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_version="$(gh api "repos/$GITHUB_REPOSITORY/contents/apps/desktop/package.json?ref=$GITHUB_SHA" --jq .content | base64 --decode | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => console.log(JSON.parse(s).version));')"
          echo "version=${base_version}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: arm64
            runner: windows-11-arm
            target: nsis
            rust_target: aarch64-pc-windows-msvc
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            target: AppImage
            rust_target: x86_64-unknown-linux-gnu
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: AppImage
            rust_target: aarch64-unknown-linux-gnu
    timeout-minutes: 60
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      # Avoid checkout's submodule cleanup on the orphaned .repos gitlinks.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform == 'linux' }}
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install Spectre-mitigated MSVC libraries
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -notin @(0, 3010)) {
            throw "Visual Studio Installer failed: $($proc.ExitCode)"
          }

      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Install build dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Configure nightly build
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$BUILD_VERSION"
          # This file contains public T3 Connect identifiers, not credentials.
          cp .env.example .env

      - name: Build installer
        run: vp run dist:desktop:artifact --platform "${{ matrix.platform }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}" --verbose

      - name: Collect update assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p update-assets
          shopt -s nullglob
          assets=(release/*.exe release/*.exe.blockmap release/*.AppImage release/*.deb release/nightly*.yml)
          test "${#assets[@]}" -gt 0
          cp "${assets[@]}" update-assets/

      - name: Upload update assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: update-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download update assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Publish update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f release/nightly.yml
          test -f release/nightly-linux.yml
          test -f release/nightly-linux-arm64.yml
          shopt -s nullglob
          installers=(release/*-arm64.exe)
          blockmaps=(release/*-arm64.exe.blockmap)
          x64_appimages=(release/*-x86_64.AppImage)
          arm64_appimages=(release/*-arm64.AppImage)
          x64_debs=(release/*-amd64.deb)
          arm64_debs=(release/*-arm64.deb)
          test "${#installers[@]}" -eq 1
          test "${#blockmaps[@]}" -eq 1
          test "${#x64_appimages[@]}" -eq 1
          test "${#arm64_appimages[@]}" -eq 1
          test "${#x64_debs[@]}" -eq 1
          test "${#arm64_debs[@]}" -eq 1
          gh release create "v${BUILD_VERSION}" \
            "${installers[@]}" "${blockmaps[@]}" \
            "${x64_appimages[@]}" "${arm64_appimages[@]}" \
            "${x64_debs[@]}" "${arm64_debs[@]}" \
            release/nightly.yml release/nightly-linux.yml release/nightly-linux-arm64.yml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Desktop ${BUILD_VERSION}" \
            --notes "Windows ARM64, Linux x64 and Linux ARM64 builds from commit ${GITHUB_SHA}. Native Windows backend; WSL runtime is not bundled." \
            --prerelease
